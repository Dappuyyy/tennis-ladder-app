<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tennis Ladder League</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a12">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#070a12',
              card: '#0f172a',
              cardBorder: '#1e293b',
              accent: '#ccff00',
              accentHover: '#b3e600',
              textMuted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .glass-effect { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-brand-bg text-slate-100 min-h-screen pb-14 font-sans antialiased">

  <div class="max-w-md mx-auto px-4 pt-5 space-y-5">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center pb-3 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">🎾</span>
          <h1 class="text-lg font-black tracking-wider text-brand-accent">TENNIS LADDER</h1>
        </div>
        <p class="text-[11px] text-brand-textMuted font-medium">Single & Double League System</p>
      </div>
      <button onclick="APP.UI.shareWA()" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition active:scale-95">
        <span>📲</span> Bagikan WA
      </button>
    </header>

    <!-- Ringkasan Stat Sesi -->
    <div class="grid grid-cols-2 gap-3 text-xs">
      <div class="glass-effect border border-brand-cardBorder p-3 rounded-2xl flex items-center justify-between">
        <span class="text-brand-textMuted">Total Pemain</span>
        <span id="statPlayers" class="text-base font-bold text-brand-accent">0</span>
      </div>
      <div class="glass-effect border border-brand-cardBorder p-3 rounded-2xl flex items-center justify-between">
        <span class="text-brand-textMuted">Match Selesai</span>
        <span id="statMatches" class="text-base font-bold text-cyan-400">0</span>
      </div>
    </div>

    <!-- Card Form Input Match -->
    <section class="glass-effect border border-brand-cardBorder rounded-2xl p-4 space-y-3.5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-brand-textMuted tracking-wider uppercase flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-accent animate-pulse"></span>
          Input Pertandingan
        </h2>
        
        <!-- Toggle Mode Single / Double -->
        <div class="flex bg-slate-900 border border-slate-700/80 rounded-lg p-0.5 text-[11px]">
          <button id="btnSingle" onclick="APP.UI.setMatchMode('single')" class="px-2.5 py-1 rounded-md font-bold bg-brand-accent text-slate-950 transition">Single</button>
          <button id="btnDouble" onclick="APP.UI.setMatchMode('double')" class="px-2.5 py-1 rounded-md font-bold text-slate-400 transition">Double</button>
        </div>
      </div>

      <!-- Form Pemain Tim A -->
      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Tim / Pemain A</label>
        <div class="grid grid-cols-1 gap-2 text-xs" id="containerTeamA">
          <select id="selectPlayerA1" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none"></select>
          <select id="selectPlayerA2" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none hidden"></select>
        </div>
      </div>

      <!-- Form Pemain Tim B -->
      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-wider">Tim / Pemain B</label>
        <div class="grid grid-cols-1 gap-2 text-xs" id="containerTeamB">
          <select id="selectPlayerB1" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none"></select>
          <select id="selectPlayerB2" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none hidden"></select>
        </div>
      </div>

      <!-- Form Skor Game -->
      <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800">
        <div>
          <label class="block text-[10px] text-brand-textMuted mb-1 font-medium">Skor Tim A</label>
          <input type="number" id="inputScoreA" placeholder="0" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-center font-black text-xl text-brand-accent focus:border-brand-accent focus:outline-none">
        </div>
        <div>
          <label class="block text-[10px] text-brand-textMuted mb-1 font-medium">Skor Tim B</label>
          <input type="number" id="inputScoreB" placeholder="0" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-center font-black text-xl text-brand-accent focus:border-brand-accent focus:outline-none">
        </div>
      </div>

      <button onclick="APP.Engine.recordMatch()" class="w-full bg-brand-accent hover:bg-brand-accentHover text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-brand-accent/10 active:scale-[0.98]">
        SIMPAN SKOR MATCH
      </button>
    </section>

    <!-- Kartu Leaderboard -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-brand-textMuted tracking-wider uppercase">Klasemen Individu</h2>
        <button onclick="APP.UI.toggleModal(true)" class="text-xs text-brand-accent font-semibold hover:underline">
          + Tambah Pemain
        </button>
      </div>

      <div id="leaderboardContainer" class="space-y-2.5"></div>
    </section>

    <!-- Footer Controls -->
    <footer class="pt-4 flex justify-between items-center text-[11px] text-slate-500 border-t border-slate-800">
      <span>Fitur Badges: 🔥 Streak | 🛡️ Upset | 🧹 Bagel</span>
      <button onclick="APP.Engine.resetAll()" class="text-rose-400/80 hover:text-rose-400">Reset System</button>
    </footer>

  </div>

  <!-- Modal Tambah Pemain -->
  <div id="playerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-5 space-y-4">
      <h3 class="text-sm font-bold text-slate-100">Tambah Pemain Baru</h3>
      <input type="text" id="newPlayerInput" placeholder="Nama Pemain" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:border-brand-accent focus:outline-none">
      <div class="flex gap-2">
        <button onclick="APP.UI.toggleModal(false)" class="flex-1 bg-slate-800 text-slate-400 font-semibold py-2 rounded-xl text-xs">Batal</button>
        <button onclick="APP.Engine.addPlayer()" class="flex-1 bg-brand-accent text-slate-950 font-bold py-2 rounded-xl text-xs">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const APP = {
      // 1. DATA STORE
      Store: {
        players: JSON.parse(localStorage.getItem('tl_players')) || [],
        matchCount: parseInt(localStorage.getItem('tl_match_count')) || 0,
        currentMode: 'single', // 'single' atau 'double'

        save() {
          localStorage.setItem('tl_players', JSON.stringify(this.players));
          localStorage.setItem('tl_match_count', this.matchCount.toString());
        }
      },

      // 2. ENGINE LOGIC
      Engine: {
        addPlayer() {
          const input = document.getElementById('newPlayerInput');
          const name = input.value.trim();
          if (!name) return;
          
          if (APP.Store.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
            alert('Nama pemain ini sudah terdaftar!');
            return;
          }

          APP.Store.players.push({
            id: Date.now(),
            name: name,
            played: 0,
            won: 0,
            lost: 0,
            gamesWon: 0,
            gamesLost: 0,
            points: 0,
            streak: 0,
            upsets: 0,
            bagels: 0
          });

          input.value = '';
          APP.Store.save();
          APP.UI.toggleModal(false);
          APP.UI.render();
        },

        recordMatch() {
          const isDouble = APP.Store.currentMode === 'double';
          
          const idxA1 = document.getElementById('selectPlayerA1').value;
          const idxA2 = document.getElementById('selectPlayerA2').value;
          const idxB1 = document.getElementById('selectPlayerB1').value;
          const idxB2 = document.getElementById('selectPlayerB2').value;

          const scoreA = parseInt(document.getElementById('inputScoreA').value);
          const scoreB = parseInt(document.getElementById('inputScoreB').value);

          // Validasi Pemain
          let teamAIndexes = [idxA1];
          let teamBIndexes = [idxB1];

          if (isDouble) {
            teamAIndexes.push(idxA2);
            teamBIndexes.push(idxB2);
          }

          const allSelected = [...teamAIndexes, ...teamBIndexes];

          if (allSelected.some(val => val === "")) {
            alert("Harap pilih semua pemain!");
            return;
          }

          // Cek pemain unik (tidak boleh ada nama ganda)
          const uniqueSelected = new Set(allSelected);
          if (uniqueSelected.size !== allSelected.length) {
            alert("Semua posisi pemain harus diisi oleh orang yang berbeda!");
            return;
          }

          if (isNaN(scoreA) || isNaN(scoreB)) {
            alert("Isi skor game dengan benar!");
            return;
          }

          // Rank Snapshot untuk perhitungan Upset
          const rankBefore = [...APP.Store.players].sort((a,b) => b.points - a.points);
          
          const teamAPlayers = teamAIndexes.map(idx => APP.Store.players[idx]);
          const teamBPlayers = teamBIndexes.map(idx => APP.Store.players[idx]);

          // Hitung rata-rata posisi peringkat untuk Upset bonus
          const avgRankA = teamAPlayers.reduce((acc, p) => acc + rankBefore.findIndex(x => x.id === p.id), 0) / teamAPlayers.length;
          const avgRankB = teamBPlayers.reduce((acc, p) => acc + rankBefore.findIndex(x => x.id === p.id), 0) / teamBPlayers.length;

          let ptsA = scoreA;
          let ptsB = scoreB;

          let isUpsetA = false, isUpsetB = false;
          let isBagelA = false, isBagelB = false;

          if (scoreA > scoreB) { // Tim A Menang
            ptsA += 3; // Bonus Menang
            if (avgRankA > avgRankB) { ptsA += 2; isUpsetA = true; } // Upset Bonus
            if (scoreB <= 1) { ptsA += 2; isBagelA = true; } // Bagel Bonus

            teamAPlayers.forEach(p => {
              p.played++; p.won++;
              p.gamesWon += scoreA; p.gamesLost += scoreB;
              p.streak++;
              if (p.streak >= 2) ptsA += 1;
              if (isUpsetA) p.upsets++;
              if (isBagelA) p.bagels++;
              p.points += ptsA;
            });

            teamBPlayers.forEach(p => {
              p.played++; p.lost++;
              p.gamesWon += scoreB; p.gamesLost += scoreA;
              p.streak = 0;
              p.points += ptsB;
            });

          } else if (scoreB > scoreA) { // Tim B Menang
            ptsB += 3;
            if (avgRankB > avgRankA) { ptsB += 2; isUpsetB = true; }
            if (scoreA <= 1) { ptsB += 2; isBagelB = true; }

            teamBPlayers.forEach(p => {
              p.played++; p.won++;
              p.gamesWon += scoreB; p.gamesLost += scoreA;
              p.streak++;
              if (p.streak >= 2) ptsB += 1;
              if (isUpsetB) p.upsets++;
              if (isBagelB) p.bagels++;
              p.points += ptsB;
            });

            teamAPlayers.forEach(p => {
              p.played++; p.lost++;
              p.gamesWon += scoreA; p.gamesLost += scoreB;
              p.streak = 0;
              p.points += ptsA;
            });

          } else { // Seri
            [...teamAPlayers, ...teamBPlayers].forEach((p, i) => {
              p.played++;
              p.streak = 0;
              if (i < teamAPlayers.length) {
                p.gamesWon += scoreA; p.gamesLost += scoreB; p.points += ptsA;
              } else {
                p.gamesWon += scoreB; p.gamesLost += scoreA; p.points += ptsB;
              }
            });
          }

          APP.Store.matchCount++;

          document.getElementById('inputScoreA').value = '';
          document.getElementById('inputScoreB').value = '';

          APP.Store.save();
          APP.UI.render();
        },

        resetAll() {
          if (confirm('Yakin mau hapus seluruh data liga dan pemain?')) {
            APP.Store.players = [];
            APP.Store.matchCount = 0;
            APP.Store.save();
            APP.UI.render();
          }
        }
      },

      // 3. UI RENDERER
      UI: {
        setMatchMode(mode) {
          APP.Store.currentMode = mode;
          const btnSingle = document.getElementById('btnSingle');
          const btnDouble = document.getElementById('btnDouble');
          const selectA2 = document.getElementById('selectPlayerA2');
          const selectB2 = document.getElementById('selectPlayerB2');

          if (mode === 'single') {
            btnSingle.className = "px-2.5 py-1 rounded-md font-bold bg-brand-accent text-slate-950 transition";
            btnDouble.className = "px-2.5 py-1 rounded-md font-bold text-slate-400 transition";
            selectA2.classList.add('hidden');
            selectB2.classList.add('hidden');
          } else {
            btnDouble.className = "px-2.5 py-1 rounded-md font-bold bg-brand-accent text-slate-950 transition";
            btnSingle.className = "px-2.5 py-1 rounded-md font-bold text-slate-400 transition";
            selectA2.classList.remove('hidden');
            selectB2.classList.remove('hidden');
          }
        },

        toggleModal(show) {
          const modal = document.getElementById('playerModal');
          if (show) modal.classList.remove('hidden');
          else modal.classList.add('hidden');
        },

        shareWA() {
          if (APP.Store.players.length === 0) return alert('Belum ada data.');
          
          let text = "🎾 *REKAP KLASEMEN TENNIS* 🎾\n\n";
          const sorted = [...APP.Store.players].sort((a,b) => b.points - a.points || (b.gamesWon - b.gamesLost) - (a.gamesWon - a.gamesLost));
          
          sorted.forEach((p, idx) => {
            let b = "";
            if (p.streak >= 2) b += "🔥";
            if (p.upsets > 0) b += "🛡️";
            if (p.bagels > 0) b += "🧹";
            const diff = p.gamesWon - p.gamesLost;
            text += `${idx + 1}. *${p.name}* ${b}\n   📊 ${p.points} Pts | Match: ${p.played} | Diff: ${diff > 0 ? '+'+diff : diff}\n`;
          });

          navigator.clipboard.writeText(text).then(() => alert('Teks rekap tersalin! Tinggal tempel (paste) di WhatsApp.'));
        },

        render() {
          document.getElementById('statPlayers').innerText = APP.Store.players.length;
          document.getElementById('statMatches').innerText = APP.Store.matchCount;

          APP.Store.players.sort((a, b) => {
            const diffA = a.gamesWon - a.gamesLost;
            const diffB = b.gamesWon - b.gamesLost;
            return b.points - a.points || diffB - diffA || b.gamesWon - a.gamesWon;
          });

          const selects = [
            document.getElementById('selectPlayerA1'),
            document.getElementById('selectPlayerA2'),
            document.getElementById('selectPlayerB1'),
            document.getElementById('selectPlayerB2')
          ];

          selects.forEach(sel => {
            const currVal = sel.value;
            sel.innerHTML = '<option value="">Pilih Pemain</option>';
            APP.Store.players.forEach((p, idx) => {
              sel.innerHTML += `<option value="${idx}">${p.name}</option>`;
            });
            sel.value = currVal;
          });

          const container = document.getElementById('leaderboardContainer');
          container.innerHTML = '';

          if (APP.Store.players.length === 0) {
            container.innerHTML = `<div class="text-center py-10 text-slate-600 text-xs">Belum ada pemain. Klik "+ Tambah Pemain" di atas.</div>`;
            return;
          }

          APP.Store.players.forEach((p, idx) => {
            const diff = p.gamesWon - p.gamesLost;
            const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
            
            let badges = "";
            if (p.streak >= 2) badges += "🔥";
            if (p.upsets > 0) badges += "🛡️";
            if (p.bagels > 0) badges += "🧹";

            const rankBorder = idx === 0 ? 'border-brand-accent/50 bg-brand-accent/5' :
                               idx === 1 ? 'border-slate-400/40' :
                               idx === 2 ? 'border-amber-700/40' : 'border-brand-cardBorder';

            const rankIcon = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;

            container.innerHTML += `
              <div class="glass-effect border ${rankBorder} p-3.5 rounded-2xl flex items-center justify-between transition">
                <div class="flex items-center gap-3">
                  <span class="text-sm font-black text-slate-400 w-6 text-center">${rankIcon}</span>
                  <div>
                    <div class="font-bold text-sm text-slate-100 flex items-center gap-1.5">
                      ${p.name}
                      <span class="text-xs">${badges}</span>
                    </div>
                    <div class="text-[11px] text-brand-textMuted space-x-2 mt-0.5">
                      <span>M: <b class="text-slate-200">${p.played}</b></span>
                      <span>W-L: <b class="text-slate-200">${p.won}-${p.lost}</b></span>
                      <span>+/-: <b class="${diff > 0 ? 'text-emerald-400' : diff < 0 ? 'text-rose-400' : 'text-slate-400'}">${diffStr}</b></span>
                    </div>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-xl font-black text-brand-accent">${p.points}</span>
                  <span class="block text-[8px] font-bold text-brand-textMuted uppercase">PTS</span>
                </div>
              </div>
            `;
          });
        }
      }
    };

    APP.UI.render();
  </script>
</body>
</html>
