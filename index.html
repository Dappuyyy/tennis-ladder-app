<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tennis Ladder League</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a12">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#070a12', card: '#0f172a', cardBorder: '#1e293b',
              accent: '#ccff00', accentHover: '#b3e600', textMuted: '#94a3b8'
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { -webkit-tap-highlight-color: transparent; }
    .glass-effect { background: rgba(15, 23, 42, .85); backdrop-filter: blur(16px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .capture-stage {
      position: fixed; left: -10000px; top: 0; width: 1080px;
      pointer-events: none; z-index: -1;
    }
    .share-card {
      width: 1080px; color: #f8fafc; overflow: hidden; position: relative;
      background:
        radial-gradient(circle at 88% 8%, rgba(204,255,0,.18), transparent 25%),
        radial-gradient(circle at 8% 88%, rgba(34,211,238,.13), transparent 30%),
        linear-gradient(145deg, #070a12 0%, #0f172a 55%, #071019 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .share-card::before {
      content: ""; position: absolute; inset: 0; opacity: .08;
      background-image: linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .share-inner { position: relative; z-index: 1; padding: 68px; }
    .share-kicker { color: #ccff00; font-size: 25px; font-weight: 900; letter-spacing: .18em; }
    .share-title { margin-top: 10px; font-size: 54px; line-height: 1.05; font-weight: 950; }
    .share-subtitle { margin-top: 12px; color: #94a3b8; font-size: 23px; }
    .share-panel { margin-top: 38px; border: 1px solid #334155; border-radius: 30px; background: rgba(15,23,42,.88); overflow: hidden; }
    .share-row { min-height: 94px; display: grid; grid-template-columns: 86px 1fr 160px 160px; align-items: center; padding: 0 28px; border-bottom: 1px solid #1e293b; }
    .share-row:last-child { border-bottom: 0; }
    .share-rank { font-size: 31px; font-weight: 900; color: #94a3b8; }
    .share-name { font-size: 28px; font-weight: 850; min-width: 0; }
    .share-meta { color: #94a3b8; font-size: 19px; margin-top: 4px; }
    .share-stat { text-align: right; color: #cbd5e1; font-size: 21px; }
    .share-points { text-align: right; color: #ccff00; font-size: 35px; font-weight: 950; }
    .share-footer { margin-top: 34px; display: flex; justify-content: space-between; align-items: center; color: #64748b; font-size: 19px; }
    .score-card { min-height: 1080px; }
    .score-box { margin-top: 60px; border: 1px solid #334155; border-radius: 36px; background: rgba(15,23,42,.9); padding: 54px 40px; }
    .score-teams { display: grid; grid-template-columns: 1fr 190px 1fr; align-items: center; gap: 28px; }
    .score-team { text-align: center; }
    .score-team-label { color: #94a3b8; font-size: 20px; font-weight: 800; letter-spacing: .12em; }
    .score-team-name { margin-top: 16px; font-size: 34px; line-height: 1.25; font-weight: 950; }
    .score-value { font-size: 92px; color: #ccff00; font-weight: 950; text-align: center; letter-spacing: -.08em; }
    .score-result { margin-top: 44px; text-align: center; font-size: 27px; color: #cbd5e1; }
    .score-badges { margin-top: 24px; text-align: center; font-size: 25px; color: #ccff00; font-weight: 850; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body class="bg-brand-bg text-slate-100 min-h-screen pb-14 font-sans antialiased">
  <div class="max-w-md mx-auto px-4 pt-5 space-y-5">
    <header class="flex justify-between items-center pb-3 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">🎾</span>
          <h1 class="text-lg font-black tracking-wider text-brand-accent">TENNIS LADDER</h1>
        </div>
        <p class="text-[11px] text-brand-textMuted font-medium">Single &amp; Double League System</p>
      </div>
      <button onclick="APP.UI.shareStandings(this)" class="bg-brand-accent/10 border border-brand-accent/30 text-brand-accent hover:bg-brand-accent/20 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition active:scale-95">
        <span>🖼️</span> Share Klasemen
      </button>
    </header>

    <div class="grid grid-cols-2 gap-3 text-xs">
      <div class="glass-effect border border-brand-cardBorder p-3 rounded-2xl flex items-center justify-between">
        <span class="text-brand-textMuted">Total Pemain</span>
        <span id="statPlayers" class="text-base font-bold text-brand-accent">0</span>
      </div>
      <div class="glass-effect border border-brand-cardBorder p-3 rounded-2xl flex items-center justify-between">
        <span class="text-brand-textMuted">Match Selesai</span>
        <span id="statMatches" class="text-base font-bold text-cyan-400">0</span>
      </div>
    </div>

    <section class="glass-effect border border-brand-cardBorder rounded-2xl p-4 space-y-3.5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-brand-textMuted tracking-wider uppercase flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-accent animate-pulse"></span>Input Pertandingan
        </h2>
        <div class="flex bg-slate-900 border border-slate-700/80 rounded-lg p-0.5 text-[11px]">
          <button id="btnSingle" onclick="APP.UI.setMatchMode('single')" class="px-2.5 py-1 rounded-md font-bold bg-brand-accent text-slate-950 transition">Single</button>
          <button id="btnDouble" onclick="APP.UI.setMatchMode('double')" class="px-2.5 py-1 rounded-md font-bold text-slate-400 transition">Double</button>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Tim / Pemain A</label>
        <div class="grid grid-cols-1 gap-2 text-xs">
          <select id="selectPlayerA1" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none"></select>
          <select id="selectPlayerA2" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none hidden"></select>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-wider">Tim / Pemain B</label>
        <div class="grid grid-cols-1 gap-2 text-xs">
          <select id="selectPlayerB1" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none"></select>
          <select id="selectPlayerB2" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-slate-100 focus:border-brand-accent focus:outline-none hidden"></select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800">
        <div>
          <label class="block text-[10px] text-brand-textMuted mb-1 font-medium">Skor Tim A</label>
          <input type="number" min="0" id="inputScoreA" placeholder="0" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-center font-black text-xl text-brand-accent focus:border-brand-accent focus:outline-none">
        </div>
        <div>
          <label class="block text-[10px] text-brand-textMuted mb-1 font-medium">Skor Tim B</label>
          <input type="number" min="0" id="inputScoreB" placeholder="0" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 text-center font-black text-xl text-brand-accent focus:border-brand-accent focus:outline-none">
        </div>
      </div>

      <button onclick="APP.Engine.recordMatch()" class="w-full bg-brand-accent hover:bg-brand-accentHover text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-brand-accent/10 active:scale-[0.98]">SIMPAN SKOR MATCH</button>
    </section>

    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-brand-textMuted tracking-wider uppercase">Klasemen Individu</h2>
        <button onclick="APP.UI.toggleModal(true)" class="text-xs text-brand-accent font-semibold hover:underline">+ Tambah Pemain</button>
      </div>
      <div id="leaderboardContainer" class="space-y-2.5"></div>
    </section>

    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <div>
          <h2 class="text-xs font-bold text-brand-textMuted tracking-wider uppercase">Histori Pertandingan</h2>
          <p class="text-[10px] text-slate-600 mt-0.5">Riwayat tersimpan di perangkat ini</p>
        </div>
        <button onclick="APP.Engine.clearHistory()" class="text-[11px] text-rose-400/80 hover:text-rose-400">Hapus Histori</button>
      </div>
      <div id="historyContainer" class="space-y-2.5"></div>
    </section>

    <footer class="pt-4 flex justify-between items-center text-[11px] text-slate-500 border-t border-slate-800">
      <span>🔥 Streak | 🛡️ Upset | 🧹 Bagel</span>
      <button onclick="APP.Engine.resetAll()" class="text-rose-400/80 hover:text-rose-400">Reset System</button>
    </footer>
  </div>

  <div id="playerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-5 space-y-4">
      <h3 class="text-sm font-bold text-slate-100">Tambah Pemain Baru</h3>
      <input type="text" id="newPlayerInput" maxlength="40" placeholder="Nama Pemain" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:border-brand-accent focus:outline-none">
      <div class="flex gap-2">
        <button onclick="APP.UI.toggleModal(false)" class="flex-1 bg-slate-800 text-slate-400 font-semibold py-2 rounded-xl text-xs">Batal</button>
        <button onclick="APP.Engine.addPlayer()" class="flex-1 bg-brand-accent text-slate-950 font-bold py-2 rounded-xl text-xs">Simpan</button>
      </div>
    </div>
  </div>

  <div id="captureStage" class="capture-stage" aria-hidden="true"></div>

  <script>
    const APP = {
      Store: {
        players: APP_SAFE_PARSE('tl_players', []),
        matchCount: Number(localStorage.getItem('tl_match_count')) || 0,
        history: APP_SAFE_PARSE('tl_match_history', []),
        currentMode: 'single',
        save() {
          localStorage.setItem('tl_players', JSON.stringify(this.players));
          localStorage.setItem('tl_match_count', String(this.matchCount));
          localStorage.setItem('tl_match_history', JSON.stringify(this.history));
        }
      },

      Engine: {
        addPlayer() {
          const input = document.getElementById('newPlayerInput');
          const name = input.value.trim();
          if (!name) return alert('Nama pemain tidak boleh kosong.');
          if (APP.Store.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert('Nama pemain ini sudah terdaftar!');
          APP.Store.players.push({
            id: Date.now() + Math.floor(Math.random() * 1000), name,
            played: 0, won: 0, lost: 0, gamesWon: 0, gamesLost: 0,
            points: 0, streak: 0, upsets: 0, bagels: 0
          });
          input.value = '';
          APP.Store.save();
          APP.UI.toggleModal(false);
          APP.UI.render();
        },

        recordMatch() {
          const isDouble = APP.Store.currentMode === 'double';
          const ids = {
            a1: document.getElementById('selectPlayerA1').value,
            a2: document.getElementById('selectPlayerA2').value,
            b1: document.getElementById('selectPlayerB1').value,
            b2: document.getElementById('selectPlayerB2').value
          };
          const scoreA = Number(document.getElementById('inputScoreA').value);
          const scoreB = Number(document.getElementById('inputScoreB').value);
          const teamAIds = [ids.a1, ...(isDouble ? [ids.a2] : [])];
          const teamBIds = [ids.b1, ...(isDouble ? [ids.b2] : [])];
          const selectedIds = [...teamAIds, ...teamBIds];

          if (selectedIds.some(v => !v)) return alert('Harap pilih semua pemain!');
          if (new Set(selectedIds).size !== selectedIds.length) return alert('Semua posisi harus diisi oleh pemain yang berbeda!');
          if (!Number.isInteger(scoreA) || !Number.isInteger(scoreB) || scoreA < 0 || scoreB < 0) return alert('Isi skor dengan bilangan bulat 0 atau lebih.');

          const teamAPlayers = teamAIds.map(id => APP.Store.players.find(p => String(p.id) === id));
          const teamBPlayers = teamBIds.map(id => APP.Store.players.find(p => String(p.id) === id));
          if ([...teamAPlayers, ...teamBPlayers].some(p => !p)) return alert('Data pemain berubah. Silakan pilih ulang pemain.');

          const rankBefore = [...APP.Store.players].sort(APP.Utils.sortPlayers);
          const avgRank = team => team.reduce((sum, p) => sum + rankBefore.findIndex(x => x.id === p.id), 0) / team.length;
          const avgRankA = avgRank(teamAPlayers);
          const avgRankB = avgRank(teamBPlayers);
          let winner = 'draw';
          let upset = false;
          let bagel = false;
          const awards = { teamA: [], teamB: [] };

          if (scoreA > scoreB) winner = 'A';
          if (scoreB > scoreA) winner = 'B';
          if (winner === 'A') { upset = avgRankA > avgRankB; bagel = scoreB <= 1; }
          if (winner === 'B') { upset = avgRankB > avgRankA; bagel = scoreA <= 1; }

          const processTeam = (team, side, ownScore, oppScore, isWinner) => {
            team.forEach(p => {
              p.played++;
              p.gamesWon += ownScore;
              p.gamesLost += oppScore;
              let gained = ownScore;
              if (winner === 'draw') {
                p.streak = 0;
              } else if (isWinner) {
                p.won++;
                p.streak++;
                gained += 3;
                if (upset) { gained += 2; p.upsets++; }
                if (bagel) { gained += 2; p.bagels++; }
                if (p.streak >= 2) gained += 1;
              } else {
                p.lost++;
                p.streak = 0;
              }
              p.points += gained;
              awards[side].push({ playerId: p.id, name: p.name, points: gained });
            });
          };

          processTeam(teamAPlayers, 'teamA', scoreA, scoreB, winner === 'A');
          processTeam(teamBPlayers, 'teamB', scoreB, scoreA, winner === 'B');

          const historyItem = {
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            createdAt: new Date().toISOString(),
            mode: APP.Store.currentMode,
            teamA: teamAPlayers.map(p => ({ id: p.id, name: p.name })),
            teamB: teamBPlayers.map(p => ({ id: p.id, name: p.name })),
            scoreA, scoreB, winner, upset, bagel, awards
          };

          APP.Store.history.unshift(historyItem);
          APP.Store.matchCount++;
          document.getElementById('inputScoreA').value = '';
          document.getElementById('inputScoreB').value = '';
          APP.Store.save();
          APP.UI.render();
          APP.UI.flash('Match tersimpan ke histori.');
        },

        clearHistory() {
          if (!APP.Store.history.length) return;
          if (confirm('Hapus seluruh histori? Statistik klasemen tidak akan diubah.')) {
            APP.Store.history = [];
            APP.Store.save();
            APP.UI.renderHistory();
          }
        },

        resetAll() {
          if (confirm('Yakin mau hapus seluruh data liga, pemain, dan histori pertandingan?')) {
            APP.Store.players = [];
            APP.Store.history = [];
            APP.Store.matchCount = 0;
            APP.Store.save();
            APP.UI.render();
          }
        }
      },

      UI: {
        setMatchMode(mode) {
          APP.Store.currentMode = mode;
          const single = mode === 'single';
          document.getElementById('btnSingle').className = `px-2.5 py-1 rounded-md font-bold transition ${single ? 'bg-brand-accent text-slate-950' : 'text-slate-400'}`;
          document.getElementById('btnDouble').className = `px-2.5 py-1 rounded-md font-bold transition ${!single ? 'bg-brand-accent text-slate-950' : 'text-slate-400'}`;
          document.getElementById('selectPlayerA2').classList.toggle('hidden', single);
          document.getElementById('selectPlayerB2').classList.toggle('hidden', single);
        },

        toggleModal(show) {
          document.getElementById('playerModal').classList.toggle('hidden', !show);
          if (show) setTimeout(() => document.getElementById('newPlayerInput').focus(), 50);
        },

        flash(message) {
          const toast = document.createElement('div');
          toast.className = 'fixed z-[80] left-1/2 -translate-x-1/2 bottom-6 bg-slate-100 text-slate-950 px-4 py-2.5 rounded-full text-xs font-bold shadow-2xl';
          toast.textContent = message;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1800);
        },

        async shareStandings(button) {
          if (!APP.Store.players.length) return alert('Belum ada data klasemen.');
          const sorted = [...APP.Store.players].sort(APP.Utils.sortPlayers);
          const stage = document.getElementById('captureStage');
          const rows = sorted.map((p, i) => {
            const diff = p.gamesWon - p.gamesLost;
            return `<div class="share-row">
              <div class="share-rank">${APP.Utils.rankLabel(i)}</div>
              <div><div class="share-name">${APP.Utils.escape(p.name)} ${APP.Utils.badges(p)}</div><div class="share-meta">${p.won} menang · ${p.lost} kalah</div></div>
              <div class="share-stat">M ${p.played}<br>± ${diff > 0 ? '+' : ''}${diff}</div>
              <div class="share-points">${p.points} PTS</div>
            </div>`;
          }).join('');
          stage.innerHTML = `<div id="standingsCapture" class="share-card"><div class="share-inner">
            <div class="share-kicker">🎾 TENNIS LADDER</div>
            <div class="share-title">KLASEMEN INDIVIDU</div>
            <div class="share-subtitle">Single &amp; Double League · ${APP.Store.matchCount} match selesai</div>
            <div class="share-panel">${rows}</div>
            <div class="share-footer"><span>🔥 Streak · 🛡️ Upset · 🧹 Bagel</span><span>${APP.Utils.dateOnly(new Date())}</span></div>
          </div></div>`;
          await APP.Share.captureAndShare(document.getElementById('standingsCapture'), `tennis-ladder-klasemen-${APP.Utils.fileDate()}.png`, button, 'Klasemen Tennis Ladder');
          stage.innerHTML = '';
        },

        async shareMatch(matchId, button) {
          const match = APP.Store.history.find(m => m.id === matchId);
          if (!match) return alert('Riwayat match tidak ditemukan.');
          const a = match.teamA.map(p => p.name).join(' / ');
          const b = match.teamB.map(p => p.name).join(' / ');
          const result = match.winner === 'draw' ? 'MATCH BERAKHIR SERI' : `PEMENANG: TIM ${match.winner}`;
          const extras = [match.upset ? '🛡️ UPSET WIN' : '', match.bagel ? '🧹 BAGEL BONUS' : ''].filter(Boolean).join(' · ') || 'FAIR PLAY · GOOD GAME';
          const stage = document.getElementById('captureStage');
          stage.innerHTML = `<div id="matchCapture" class="share-card score-card"><div class="share-inner">
            <div class="share-kicker">🎾 TENNIS LADDER</div>
            <div class="share-title">MATCH RESULT</div>
            <div class="share-subtitle">${match.mode.toUpperCase()} · ${APP.Utils.dateTime(match.createdAt)}</div>
            <div class="score-box"><div class="score-teams">
              <div class="score-team"><div class="score-team-label">TIM A</div><div class="score-team-name">${APP.Utils.escape(a)}</div></div>
              <div class="score-value">${match.scoreA}–${match.scoreB}</div>
              <div class="score-team"><div class="score-team-label">TIM B</div><div class="score-team-name">${APP.Utils.escape(b)}</div></div>
            </div><div class="score-result">${result}</div><div class="score-badges">${extras}</div></div>
            <div class="share-footer"><span>Single &amp; Double League System</span><span>#TennisLadder</span></div>
          </div></div>`;
          await APP.Share.captureAndShare(document.getElementById('matchCapture'), `tennis-match-${APP.Utils.fileDate(match.createdAt)}-${match.id.slice(-6)}.png`, button, `${a} ${match.scoreA}-${match.scoreB} ${b}`);
          stage.innerHTML = '';
        },

        render() {
          document.getElementById('statPlayers').textContent = APP.Store.players.length;
          document.getElementById('statMatches').textContent = APP.Store.matchCount;
          APP.Store.players.sort(APP.Utils.sortPlayers);
          APP.UI.renderSelects();
          APP.UI.renderLeaderboard();
          APP.UI.renderHistory();
          APP.UI.setMatchMode(APP.Store.currentMode);
        },

        renderSelects() {
          ['selectPlayerA1','selectPlayerA2','selectPlayerB1','selectPlayerB2'].forEach(id => {
            const sel = document.getElementById(id);
            const current = sel.value;
            sel.innerHTML = '<option value="">Pilih Pemain</option>' + APP.Store.players.map(p => `<option value="${p.id}">${APP.Utils.escape(p.name)}</option>`).join('');
            if ([...sel.options].some(o => o.value === current)) sel.value = current;
          });
        },

        renderLeaderboard() {
          const container = document.getElementById('leaderboardContainer');
          if (!APP.Store.players.length) {
            container.innerHTML = '<div class="text-center py-10 text-slate-600 text-xs">Belum ada pemain. Klik "+ Tambah Pemain" di atas.</div>';
            return;
          }
          container.innerHTML = APP.Store.players.map((p, idx) => {
            const diff = p.gamesWon - p.gamesLost;
            const rankBorder = idx === 0 ? 'border-brand-accent/50 bg-brand-accent/5' : idx === 1 ? 'border-slate-400/40' : idx === 2 ? 'border-amber-700/40' : 'border-brand-cardBorder';
            return `<div class="glass-effect border ${rankBorder} p-3.5 rounded-2xl flex items-center justify-between transition">
              <div class="flex items-center gap-3 min-w-0"><span class="text-sm font-black text-slate-400 w-6 text-center shrink-0">${APP.Utils.rankLabel(idx)}</span>
                <div class="min-w-0"><div class="font-bold text-sm text-slate-100 flex items-center gap-1.5"><span class="truncate">${APP.Utils.escape(p.name)}</span><span class="text-xs shrink-0">${APP.Utils.badges(p)}</span></div>
                  <div class="text-[11px] text-brand-textMuted space-x-2 mt-0.5"><span>M: <b class="text-slate-200">${p.played}</b></span><span>W-L: <b class="text-slate-200">${p.won}-${p.lost}</b></span><span>+/-: <b class="${diff > 0 ? 'text-emerald-400' : diff < 0 ? 'text-rose-400' : 'text-slate-400'}">${diff > 0 ? '+' : ''}${diff}</b></span></div>
                </div></div>
              <div class="text-right ml-3"><span class="text-xl font-black text-brand-accent">${p.points}</span><span class="block text-[8px] font-bold text-brand-textMuted uppercase">PTS</span></div>
            </div>`;
          }).join('');
        },

        renderHistory() {
          const container = document.getElementById('historyContainer');
          if (!APP.Store.history.length) {
            container.innerHTML = '<div class="text-center py-8 border border-dashed border-slate-800 rounded-2xl text-slate-600 text-xs">Belum ada histori pertandingan.</div>';
            return;
          }
          container.innerHTML = APP.Store.history.map(m => {
            const a = m.teamA.map(p => p.name).join(' / ');
            const b = m.teamB.map(p => p.name).join(' / ');
            const winnerA = m.scoreA > m.scoreB;
            const winnerB = m.scoreB > m.scoreA;
            return `<article class="glass-effect border border-brand-cardBorder rounded-2xl p-3.5">
              <div class="flex justify-between gap-3 items-start"><div><div class="text-[9px] font-black tracking-widest text-brand-accent uppercase">${m.mode} match</div><div class="text-[10px] text-brand-textMuted mt-0.5">${APP.Utils.dateTime(m.createdAt)}</div></div>
              <button onclick="APP.UI.shareMatch('${m.id}', this)" class="shrink-0 border border-brand-accent/30 bg-brand-accent/10 text-brand-accent rounded-lg px-2.5 py-1.5 text-[10px] font-bold active:scale-95">🖼️ Share Hasil</button></div>
              <div class="grid grid-cols-[1fr_auto_1fr] gap-2 items-center mt-3"><div class="text-xs font-bold ${winnerA ? 'text-slate-100' : 'text-slate-400'} break-words">${APP.Utils.escape(a)}</div>
              <div class="text-xl font-black tracking-tight text-brand-accent px-2">${m.scoreA}–${m.scoreB}</div><div class="text-xs text-right font-bold ${winnerB ? 'text-slate-100' : 'text-slate-400'} break-words">${APP.Utils.escape(b)}</div></div>
              ${(m.upset || m.bagel) ? `<div class="mt-2 text-[10px] text-slate-500">${m.upset ? '🛡️ Upset' : ''} ${m.bagel ? '🧹 Bagel' : ''}</div>` : ''}
            </article>`;
          }).join('');
        }
      },

      Share: {
        async captureAndShare(element, filename, button, title) {
          if (typeof html2canvas !== 'function') return alert('Library gambar belum termuat. Periksa koneksi internet lalu coba lagi.');
          const oldText = button ? button.innerHTML : '';
          if (button) { button.disabled = true; button.innerHTML = 'Membuat…'; }
          try {
            await document.fonts.ready;
            const canvas = await html2canvas(element, {
              backgroundColor: '#070a12', scale: 1, useCORS: true,
              logging: false, width: element.scrollWidth, height: element.scrollHeight
            });
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1));
            if (!blob) throw new Error('Gagal membuat PNG.');
            const file = new File([blob], filename, { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({ title, text: title, files: [file] });
                APP.UI.flash('Kartu gambar siap dibagikan.');
                return;
              } catch (err) {
                if (err && err.name === 'AbortError') return;
              }
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = filename;
            document.body.appendChild(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            APP.UI.flash('Gambar PNG berhasil diunduh.');
          } catch (err) {
            console.error(err);
            alert('Gagal membuat kartu gambar. Silakan coba lagi.');
          } finally {
            if (button) { button.disabled = false; button.innerHTML = oldText; }
          }
        }
      },

      Utils: {
        sortPlayers(a, b) {
          const diffA = a.gamesWon - a.gamesLost;
          const diffB = b.gamesWon - b.gamesLost;
          return b.points - a.points || diffB - diffA || b.gamesWon - a.gamesWon || a.name.localeCompare(b.name, 'id');
        },
        badges(p) { return `${p.streak >= 2 ? '🔥' : ''}${p.upsets > 0 ? '🛡️' : ''}${p.bagels > 0 ? '🧹' : ''}`; },
        rankLabel(i) { return i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`; },
        escape(value) {
          return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
        },
        dateTime(value) {
          const d = new Date(value);
          return Number.isNaN(d.getTime()) ? '-' : new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium', timeStyle: 'short' }).format(d);
        },
        dateOnly(value) {
          return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }).format(new Date(value));
        },
        fileDate(value = new Date()) {
          const d = new Date(value);
          return Number.isNaN(d.getTime()) ? 'match' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
      }
    };

    function APP_SAFE_PARSE(key, fallback) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        return Array.isArray(parsed) ? parsed : fallback;
      } catch (_) { return fallback; }
    }

    document.getElementById('newPlayerInput').addEventListener('keydown', e => { if (e.key === 'Enter') APP.Engine.addPlayer(); });
    document.getElementById('playerModal').addEventListener('click', e => { if (e.target.id === 'playerModal') APP.UI.toggleModal(false); });
    APP.UI.render();
  </script>
</body>
</html>
